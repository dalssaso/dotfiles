# Kanagawa semantic roles: Wave in dark, Lotus in light.
# Source: rebelot/kanagawa.nvim lua/kanagawa/colors.lua and themes.lua
# (bb85e4bfc8d89b0e62c8fa53ccdd13d12e2f77b3). The README palette table is
# stale; trust colors.lua.
# Role and variant names are theme-agnostic on purpose -- swapping themes later
# means editing only this file.
#
# accent is the UI focus colour (selection, pointer, active border, prompt).
# It equals blue today; it is a separate role so the accent can change without
# touching the templates.

[palette.dark]
bg_dim = "#16161d"   # sumiInk0
bg0    = "#1f1f28"   # sumiInk3
bg1    = "#2a2a37"   # sumiInk4
bg2    = "#363646"   # sumiInk5
bg3    = "#54546d"   # sumiInk6
fg     = "#dcd7ba"   # fujiWhite
grey0  = "#727169"   # fujiGray
grey1  = "#c8c093"   # oldWhite
red    = "#e46876"   # waveRed
orange = "#ffa066"   # surimiOrange
yellow = "#e6c384"   # carpYellow
green  = "#98bb6c"   # springGreen
aqua   = "#7aa89f"   # waveAqua2
blue   = "#7e9cd8"   # crystalBlue
purple = "#957fb8"   # oniViolet
accent = "#7e9cd8"   # crystalBlue

[palette.light]
bg_dim = "#e5ddb0"   # lotusWhite2
bg0    = "#f2ecbc"   # lotusWhite3
bg1    = "#e7dba0"   # lotusWhite4
bg2    = "#e4d794"   # lotusWhite5
bg3    = "#c9cbd1"   # lotusViolet3
fg     = "#545464"   # lotusInk1
grey0  = "#8a8980"   # lotusGray3
grey1  = "#716e61"   # lotusGray2
red    = "#c84053"   # lotusRed
orange = "#cc6d00"   # lotusOrange
yellow = "#77713f"   # lotusYellow
green  = "#6f894e"   # lotusGreen
aqua   = "#597b75"   # lotusAqua
blue   = "#4d699b"   # lotusBlue4
purple = "#624c83"   # lotusViolet4
accent = "#4d699b"   # lotusBlue4
