# Ayu semantic roles.
# Source: Shatur/neovim-ayu lua/ayu/colors.lua (current upstream ayu spec),
# corroborated for bg/fg and the accents by Ghostty's bundled Ayu Mirage and
# Ayu Light themes.
# Role and variant names are theme-agnostic on purpose -- swapping themes later
# means editing only this file.
#
# Two values are derived rather than taken from ayu, both in the dark variant:
#   bg1   -- ayu has no surface between bg (#1f2430) and guide_normal
#            (#323843); this is their channel-wise midpoint.
#   grey1 -- ayu's Mirage comment (#6c7a8b) and ui (#707a8c) are nearly the
#            same colour, which would collapse grey0 and grey1 into one role;
#            this is the midpoint of ui -> fg.

[palette.dark]
bg_dim = "#171b24"   # line
bg0    = "#1f2430"   # bg
bg1    = "#282e39"   # derived
bg2    = "#323843"   # guide_normal
bg3    = "#444a55"   # guide_active
fg     = "#cccac2"   # fg
grey0  = "#6c7a8b"   # comment
grey1  = "#9ea2a7"   # derived
red    = "#f28779"   # markup
orange = "#ffad66"   # keyword
yellow = "#ffd173"   # func
green  = "#d5ff80"   # string
aqua   = "#95e6cb"   # regexp
blue   = "#73d0ff"   # entity
purple = "#dfbfff"   # constant

[palette.light]
bg_dim = "#f3f4f5"   # panel_bg
bg0    = "#f8f9fa"   # bg
bg1    = "#e7eaed"   # line
bg2    = "#e4e6e9"   # guide_normal
bg3    = "#cccfd3"   # gutter_normal
fg     = "#5c6166"   # fg
grey0  = "#abadb1"   # comment
grey1  = "#8a9199"   # ui
red    = "#f07171"   # markup
orange = "#fa8d3e"   # keyword
yellow = "#f2ae49"   # func
green  = "#86b300"   # string
aqua   = "#4cbf99"   # regexp
blue   = "#399ee6"   # entity
purple = "#a37acc"   # constant
